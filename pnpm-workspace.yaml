# Install only versions published at least 3 days ago, the window in which
# npm still allows a release to be unpublished. Keep it no longer than
# minimumReleaseAge in renovate.json, so Renovate's updates can be locked.
minimumReleaseAge: 4320

# Fail the install when a new dependency brings a build script that is
# neither allowed nor ignored here.
strictDepBuilds: true
# Their prebuilt binaries come as optional dependencies, so the build works
# without running these scripts.
ignoredBuiltDependencies:
  - esbuild
  - workerd
