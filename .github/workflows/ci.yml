name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Newer pushes to a pull request supersede older runs, but a production
  # deployment that has passed the gates is never cancelled midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, build, and quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          install-scripts: "true"

      # The installs below run in the background while the checks and the
      # build run; their PATH changes take effect only after a wait step.
      - id: playwright
        name: Install Playwright browser
        background: true
        run: pnpm exec playwright install --with-deps chromium

      # Pinned by version and checksum. The tests below use it as well.
      - id: lychee
        name: Install lychee
        background: true
        run: |
          archive="lychee-x86_64-unknown-linux-gnu"
          curl --proto "=https" --tlsv1.2 -fsSLo "${RUNNER_TEMP}/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-v${LYCHEE_VERSION}/${archive}.tar.gz"
          echo "${LYCHEE_SHA256}  ${RUNNER_TEMP}/lychee.tar.gz" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/lychee.tar.gz" -C "${RUNNER_TEMP}"
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 "${RUNNER_TEMP}/${archive}/lychee" "${RUNNER_TEMP}/bin/lychee"
          echo "${RUNNER_TEMP}/bin" >> "$GITHUB_PATH"
        env:
          LYCHEE_VERSION: 0.24.2
          LYCHEE_SHA256: 1f4e0ef7f6554a6ed33dd7ac144fb2e1bbed98598e7af973042fc5cd43951c9a

      # The build stays out of this group: astro check writes .astro/ as well.
      - parallel:
          - name: Lint (ESLint, Stylelint)
            run: pnpm lint

          - name: Format check (Prettier)
            run: pnpm format:check

          - name: Type check (astro check)
            run: pnpm check

      - name: Build
        run: pnpm build

      - name: HTML validation (html-validate)
        run: pnpm test:html

      - name: Wait for lychee
        wait: lychee

      - name: Link check (lychee, internal links only)
        run: pnpm test:links

      - name: Wait for the Playwright browser
        wait: playwright

      - name: Accessibility (axe, light/dark x mobile/desktop)
        run: pnpm test:a11y

      # Not alongside the tests: sharing the CPU skews the scores.
      - name: Lighthouse CI
        run: pnpm test:lighthouse

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-reports
          path: |
            playwright-report/
            .lighthouseci/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      # The deploy jobs ship exactly what passed the gates above.
      - name: Upload build for deployment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: |
            dist/
            .wrangler/deploy/config.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  preview:
    name: Deploy a Preview
    needs: ci
    # Forked pull requests get no Cloudflare credentials.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    # Shared with preview-cleanup.yml, so a Preview is never created after
    # the pull request has been closed and its Preview deleted.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: state
        name: Check that the pull request is still open
        run: |
          state="$(gh pr view "$PR_NUMBER" --json state --jq .state)"
          echo "open=$([ "$state" = OPEN ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Only wrangler is needed here; install scripts stay off next to the token.
      - uses: ./.github/actions/setup

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site

      - id: preview
        name: Create or update the Preview
        if: steps.state.outputs.open == 'true'
        # Previews live on their own Worker, apart from production. Keep its
        # name in sync with preview-cleanup.yml; the URL is only taken when
        # Wrangler reports that Worker.
        # Read the URL from Wrangler's machine-readable output file rather than
        # stdout, which also carries the upload logs.
        run: |
          pnpm exec wrangler preview --worker-name "$PREVIEW_WORKER" --name "pr-${PR_NUMBER}"
          preview_url="$(jq -ser --arg worker "$PREVIEW_WORKER" 'map(select(.type == "preview")) | last | select(.worker_name == $worker) | .preview_urls[0]' "$WRANGLER_OUTPUT_FILE_PATH")"
          [[ "$preview_url" =~ ^https://[A-Za-z0-9.-]+\.workers\.dev/?$ ]] || {
            echo "Unexpected Preview URL: $preview_url" >&2
            exit 1
          }
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_WORKER: kryota-dev-website-preview
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the security headers
        if: steps.state.outputs.open == 'true'
        run: node scripts/check-deployed-headers.mjs "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}

      # Update the comment that carries the marker, so other comments by
      # github-actions are never overwritten.
      - name: Comment the Preview URL
        if: steps.state.outputs.open == 'true'
        run: |
          marker="<!-- preview-url -->"
          body="${marker}
          Preview: ${PREVIEW_URL} (${HEAD_SHA})"
          id="$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | sed -n 1p)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  deploy:
    name: Deploy to production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The production token lives in this environment, which only main can use.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Only wrangler is needed here; install scripts stay off next to the token.
      - uses: ./.github/actions/setup

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site

      # Serves kryota.dev only (routes in wrangler.jsonc).
      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The canonical host must serve every header and stay indexable.
      - name: Check the security headers
        run: node scripts/check-deployed-headers.mjs "$SITE_URL"
        env:
          SITE_URL: https://kryota.dev/
