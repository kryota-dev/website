name: Pull request

on:
  pull_request:

permissions:
  contents: read

# Newer pushes to a pull request supersede older runs.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  preview:
    name: Deploy a Preview
    needs: quality
    # Forked pull requests get no Cloudflare credentials.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    # Shared with preview-cleanup.yml, so a Preview is never created after
    # the pull request has been closed and its Preview deleted.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - id: state
        name: Check that the pull request is still open
        run: |
          state="$(gh pr view "$PR_NUMBER" --json state --jq .state)"
          echo "open=$([ "$state" = OPEN ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Only wrangler is needed here; install scripts stay off next to the token.
      - uses: ./.github/actions/setup

      # The artifact comes from the quality gates, where dependency code runs.
      # Only its static files are used: it is unpacked outside the workspace,
      # so it cannot replace the checked-out files, and Wrangler takes its
      # config from wrangler.deploy.json, never from the build output.
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: ${{ runner.temp }}/site

      # Wrangler follows symbolic links when it reads the assets, so only
      # regular files and directories are taken.
      - name: Take the static files from the build
        run: |
          unexpected="$(find "${RUNNER_TEMP}/site" ! -type f ! -type d)"
          if [ -n "$unexpected" ]; then
            printf 'The build has entries that are not regular files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          mkdir -p dist/client
          cp -R "${RUNNER_TEMP}/site/." dist/client/

      - id: preview
        name: Create or update the Preview
        if: steps.state.outputs.open == 'true'
        # Previews live on their own Worker, apart from production. Keep its
        # name in sync with preview-cleanup.yml; the URL is only taken when
        # Wrangler reports that Worker.
        # Read the URL from Wrangler's machine-readable output file rather than
        # stdout, which also carries the upload logs.
        run: |
          pnpm exec wrangler preview --config wrangler.deploy.json --worker-name "$PREVIEW_WORKER" --name "pr-${PR_NUMBER}"
          preview_url="$(jq -ser --arg worker "$PREVIEW_WORKER" 'map(select(.type == "preview")) | last | select(.worker_name == $worker) | .preview_urls[0]' "$WRANGLER_OUTPUT_FILE_PATH")"
          [[ "$preview_url" =~ ^https://[A-Za-z0-9.-]+\.workers\.dev/?$ ]] || {
            echo "Unexpected Preview URL: $preview_url" >&2
            exit 1
          }
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_WORKER: kryota-dev-website-preview
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check the security headers
        if: steps.state.outputs.open == 'true'
        run: node scripts/check-deployed-headers.mjs "$PREVIEW_URL"
        env:
          PREVIEW_URL: ${{ steps.preview.outputs.url }}

      # Update the comment that carries the marker, so other comments by
      # github-actions are never overwritten.
      - name: Comment the Preview URL
        if: steps.state.outputs.open == 'true'
        run: |
          marker="<!-- preview-url -->"
          body="${marker}
          Preview: ${PREVIEW_URL} (${HEAD_SHA})"
          id="$(gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${marker}\"))) | .id" | sed -n 1p)"
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/${GH_REPO}/issues/comments/${id}" -f body="$body" > /dev/null
          else
            gh api "repos/${GH_REPO}/issues/${PR_NUMBER}/comments" -f body="$body" > /dev/null
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
