name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

# A production deployment that has passed the gates is never cancelled midway.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy to production
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The production token lives in this environment, which only main can use.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Only wrangler is needed here; install scripts stay off next to the token.
      - uses: ./.github/actions/setup

      # The artifact comes from the quality gates, where dependency code runs.
      # Only its static files are used: it is unpacked outside the workspace,
      # so it cannot replace the checked-out files, and Wrangler takes its
      # config from wrangler.deploy.json, never from the build output.
      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: ${{ runner.temp }}/site

      # Wrangler follows symbolic links when it reads the assets, so only
      # regular files and directories are taken.
      - name: Take the static files from the build
        run: |
          unexpected="$(find "${RUNNER_TEMP}/site" ! -type f ! -type d)"
          if [ -n "$unexpected" ]; then
            printf 'The build has entries that are not regular files:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          mkdir -p dist/client
          cp -R "${RUNNER_TEMP}/site/." dist/client/

      # Serves kryota.dev only (routes in wrangler.deploy.json).
      - name: Deploy
        run: pnpm exec wrangler deploy --config wrangler.deploy.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The canonical host must serve every header and stay indexable.
      - name: Check the security headers
        run: node scripts/check-deployed-headers.mjs "$SITE_URL"
        env:
          SITE_URL: https://kryota.dev/
