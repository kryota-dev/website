name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

# A production deployment that has passed the gates is never cancelled midway.
concurrency:
  group: main
  cancel-in-progress: false

jobs:
  quality:
    name: Quality
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy to production
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The production token lives in this environment, which only main can use.
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Only wrangler is needed here; install scripts stay off next to the token.
      - uses: ./.github/actions/setup

      - name: Download the build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site

      # Serves kryota.dev only (routes in wrangler.jsonc).
      - name: Deploy
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The canonical host must serve every header and stay indexable.
      - name: Check the security headers
        run: node scripts/check-deployed-headers.mjs "$SITE_URL"
        env:
          SITE_URL: https://kryota.dev/
