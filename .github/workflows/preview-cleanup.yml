name: Preview cleanup

# pull_request_target also runs for pull requests with merge conflicts, which
# pull_request skips. It runs the base branch's workflow and code; nothing
# from the pull request is checked out or executed here.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    name: Delete the Preview
    # Previews are only created for pull requests from this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    # Shared with the preview job in ci.yml; see there.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Only wrangler is needed here; install scripts stay off next to the token.
      - uses: ./.github/actions/setup

      # The Worker that holds the Previews; see the preview job in ci.yml.
      - name: Delete the Preview
        run: pnpm exec wrangler preview delete --worker-name "$PREVIEW_WORKER" --name "pr-${PR_NUMBER}" --skip-confirmation
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_WORKER: kryota-dev-website-preview
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
