name: Preview cleanup

# pull_request_target also runs for pull requests with merge conflicts, which
# pull_request skips. It runs the base branch's workflow and code; nothing
# from the pull request is checked out or executed here.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read

jobs:
  delete:
    name: Delete the Preview
    # Previews are only created for pull requests from this repository.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    # Shared with the preview job in ci.yml; see there.
    concurrency:
      group: preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      # Only wrangler is needed here; no install scripts run next to the token.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Delete the Preview
        run: pnpm exec wrangler preview delete --name "pr-${PR_NUMBER}" --skip-confirmation
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
